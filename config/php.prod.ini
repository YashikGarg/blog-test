; Prod PHP hardening. Run with: php -c config/php.prod.ini ... (or include these in the server's php.ini)
expose_php = Off
display_errors = Off
log_errors = On
session.use_only_cookies = 1
session.use_trans_sid = 0
session.use_strict_mode = 1
opcache.validate_timestamps = 0
zend.exception_ignore_args = On
